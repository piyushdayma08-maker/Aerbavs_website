<svg viewBox="0 0 300 295" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AERBAVS MRO Parts and Leasing FZCO">
  <title>AERBAVS MRO Parts &amp; Leasing FZCO</title>

  <!-- ═══ A SHAPE LEFT LEG ═══ -->
  <polygon points="130,12 155,12 83,193 46,193" fill="#1C3872"/>

  <!-- ═══ A SHAPE RIGHT LEG ═══ -->
  <polygon points="145,12 170,12 254,193 217,193" fill="#1C3872"/>

  <!-- ═══ AIRCRAFT FRONT-VIEW (white, inside the A) ═══ -->
  <!-- Fuselage body -->
  <rect x="143" y="72" width="14" height="55" rx="7" fill="white"/>
  <!-- Nose cone -->
  <ellipse cx="150" cy="72" rx="7" ry="5" fill="white"/>
  <!-- Cockpit windows (dark shading) -->
  <ellipse cx="150" cy="79" rx="4.5" ry="3" fill="#1C3872" opacity="0.55"/>

  <!-- Wings -->
  <polygon points="55,118 245,118 240,131 60,131" fill="white"/>

  <!-- Left engine nacelle (outer) -->
  <ellipse cx="84" cy="132" rx="21" ry="13" fill="#0E1F40"/>
  <!-- Left engine inlet ring -->
  <ellipse cx="84" cy="132" rx="14" ry="8" fill="#1C3872" opacity="0.4"/>

  <!-- Right engine nacelle (outer) -->
  <ellipse cx="216" cy="132" rx="21" ry="13" fill="#0E1F40"/>
  <!-- Right engine inlet ring -->
  <ellipse cx="216" cy="132" rx="14" ry="8" fill="#1C3872" opacity="0.4"/>

  <!-- ═══ GEAR / COG WHEEL (grey, at the foot of the A) ═══ -->
  <g transform="translate(150,173)">
    <!-- Main disc -->
    <circle r="21" fill="#6B7280"/>
    <!-- 8 teeth using rotated rectangles -->
    <rect x="-4.5" y="-27" width="9" height="9" rx="1.5" fill="#6B7280"/>
    <rect x="-4.5" y="18"  width="9" height="9" rx="1.5" fill="#6B7280"/>
    <rect x="-27" y="-4.5" width="9" height="9" rx="1.5" fill="#6B7280"/>
    <rect x="18"  y="-4.5" width="9" height="9" rx="1.5" fill="#6B7280"/>
    <g transform="rotate(45)">
      <rect x="-4.5" y="-27" width="9" height="9" rx="1.5" fill="#6B7280"/>
      <rect x="-4.5" y="18"  width="9" height="9" rx="1.5" fill="#6B7280"/>
      <rect x="-27" y="-4.5" width="9" height="9" rx="1.5" fill="#6B7280"/>
      <rect x="18"  y="-4.5" width="9" height="9" rx="1.5" fill="#6B7280"/>
    </g>
    <!-- Inner white hub -->
    <circle r="12.5" fill="white"/>
    <!-- Wrench symbol inside hub -->
    <!-- Handle -->
    <rect x="-3" y="-2" width="6" height="11" rx="1.5" fill="#6B7280"/>
    <!-- Open-end head (C-shape) -->
    <path d="M -6 -7 A 6 6 0 0 1 6 -7 L 3 -7 A 3 3 0 0 0 -3 -7 Z" fill="#6B7280"/>
    <rect x="-6" y="-10" width="4" height="3" rx="1" fill="#6B7280"/>
    <rect x="2"  y="-10" width="4" height="3" rx="1" fill="#6B7280"/>
  </g>

  <!-- ═══ SWOOSH ARC + SMALL AIRCRAFT (top right) ═══ -->
  <path d="M 164 46 Q 210 18 248 29" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Small aircraft at swoosh end -->
  <polygon points="247,24 260,33 246,37 243,30" fill="#1C3872"/>
  <!-- Second swoosh arc (grey, slightly larger) -->
  <path d="M 158 52 Q 208 26 249 38" fill="none" stroke="#C4C4C4" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- ═══ AERBAVS WORDMARK ═══ -->
  <text
    x="150" y="229"
    text-anchor="middle"
    font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="35"
    fill="#1C3872"
    letter-spacing="6"
  >AERBAVS</text>

  <!-- Decorative divider lines -->
  <line x1="14"  y1="240" x2="84"  y2="240" stroke="#1C3872" stroke-width="1.5"/>
  <line x1="216" y1="240" x2="286" y2="240" stroke="#1C3872" stroke-width="1.5"/>

  <!-- Tagline -->
  <text
    x="150" y="244"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="600"
    font-size="9"
    fill="#1C3872"
    letter-spacing="2"
  >MRO PARTS &amp; LEASING-FZCO</text>
</svg>
